apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    deployment:
      podAnnotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: /metrics
    logs:
      access:
        enabled: true
        format: json
        fields:
          general:
            defaultmode: keep
          headers:
            defaultmode: drop
            names:
              traceparent: keep
    additionalArguments:
      # The packaged chart does not expose query-parameter filtering yet.
      - --accesslog.fields.queryparameters.defaultmode=drop
    tracing:
      serviceName: traefik
      sampleRate: 0.1
      resourceAttributes:
        cluster: mail-server
      otlp:
        enabled: true
        http:
          enabled: true
          endpoint: http://monitoring-alloy.monitoring-system.svc:4318/v1/traces
    service:
      spec:
        allocateLoadBalancerNodePorts: false
        externalIPs:
          - 46.225.250.229
