---
- name: Run Sealed Secrets recovery key preflight checks
  ansible.builtin.import_tasks: preflight.yml

- name: Wait for the K3s node to become ready
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - wait
      - --for=condition=Ready
      - node
      - --all
      - "--timeout={{ restore_sealed_secrets_key_ready_timeout }}"
  when: not ansible_check_mode or restore_sealed_secrets_key_k3s_executable.stat.exists
  changed_when: false
  check_mode: false

- name: Restore missing Sealed Secrets recovery keys
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - apply
      - --filename=-
    stdin: "{{ lookup('ansible.builtin.template', 'sealed-secrets-key.yaml.j2') }}"
    stdin_add_newline: false
  loop: "{{ restore_sealed_secrets_key_resources }}"
  when:
    - not ansible_check_mode
    - item.metadata.name not in restore_sealed_secrets_key_existing_by_name
  register: restore_sealed_secrets_key_apply
  changed_when: >-
    restore_sealed_secrets_key_apply.stdout_lines
    | select('search', ' (created|configured)$')
    | list
    | length > 0
  no_log: true

- name: Report missing recovery keys in check mode
  ansible.builtin.debug:
    msg: A backed-up Sealed Secrets recovery key would be restored.
  loop: "{{ restore_sealed_secrets_key_resources }}"
  when:
    - ansible_check_mode
    - item.metadata.name not in restore_sealed_secrets_key_existing_by_name
  changed_when: true
  no_log: true
