---
- name: Run Sealed Secrets recovery key preflight checks before verification
  ansible.builtin.import_tasks: preflight.yml

- name: Verify every backed-up Sealed Secrets recovery key exists
  ansible.builtin.assert:
    that:
      - >-
        restore_sealed_secrets_key_backed_by_name
        | ansible.builtin.dict2items
        | map(attribute='key')
        | difference(
            restore_sealed_secrets_key_existing_by_name
            | ansible.builtin.dict2items
            | map(attribute='key')
          )
        | length == 0
    fail_msg: A backed-up Sealed Secrets recovery key is missing from the cluster.
  no_log: true
