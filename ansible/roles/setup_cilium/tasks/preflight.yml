---
- name: Validate Cilium inputs and host support
  ansible.builtin.assert:
    that:
      - setup_cilium_version == "1.20.1"
      - ansible_facts.kernel is version("5.10", ">=")
      - ansible_facts.architecture == "x86_64"
    fail_msg: Cilium requires the pinned version, Linux 5.10 or newer, and amd64.

- name: Verify the Cilium network device exists
  ansible.builtin.command:
    argv: [/usr/sbin/ip, link, show, dev, "{{ setup_cilium_device }}"]
  changed_when: false
  check_mode: false

- name: Verify the Floating IP exists on the Cilium network device
  ansible.builtin.command:
    argv: [/usr/sbin/ip, -4, address, show, dev, "{{ setup_cilium_device }}"]
  register: setup_cilium_device_addresses
  changed_when: false
  check_mode: false

- name: Require the Floating IP before installing Cilium
  ansible.builtin.assert:
    that:
      - setup_cilium_floating_ip in setup_cilium_device_addresses.stdout
    fail_msg: The Floating IP must be configured before Cilium is installed.

- name: Inspect the canonical Cilium values file
  ansible.builtin.stat:
    path: "{{ setup_cilium_values_path }}"
  delegate_to: localhost
  become: false
  register: setup_cilium_values_file

- name: Require the canonical Cilium values file
  ansible.builtin.assert:
    that:
      - setup_cilium_values_file.stat.exists
      - setup_cilium_values_file.stat.isreg
    fail_msg: "Missing canonical Cilium values file: {{ setup_cilium_values_path }}"

- name: Check the local Helm client
  ansible.builtin.command:
    argv: [helm, version, --short]
  delegate_to: localhost
  become: false
  register: setup_cilium_helm_version
  changed_when: false
  check_mode: false

- name: Check the target Kubernetes context
  ansible.builtin.command:
    argv:
      - kubectl
      - --context
      - "{{ setup_cilium_kube_context }}"
      - get
      - node
      - "{{ setup_cilium_node_name }}"
  delegate_to: localhost
  become: false
  changed_when: false
  check_mode: false
