---
- name: Verify K3s server hosts
  hosts: k3s_servers
  gather_facts: true
  become: false

  pre_tasks:
    - name: Require the mail server become password
      ansible.builtin.assert:
        that:
          - ansible_become_password is defined
          - ansible_become_password != "CHANGE_ME"
        fail_msg: Run `make vault-edit` and replace the become password placeholder before verifying.

  tasks:
    - name: Verify the Floating IP configuration
      ansible.builtin.include_role:
        name: setup_floating_ip
        tasks_from: verify
        apply:
          become: true

    - name: Verify K3s server configuration
      ansible.builtin.include_role:
        name: setup_k3s_server
        tasks_from: verify
        apply:
          become: true

    - name: Verify the Sealed Secrets recovery key
      ansible.builtin.include_role:
        name: restore_sealed_secrets_key
        tasks_from: verify
        apply:
          become: true
