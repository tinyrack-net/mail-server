---
- name: Migrate the single-node K3s cluster to Cilium
  hosts: k3s_servers
  gather_facts: true
  become: false
  vars:
    setup_cilium_version: 1.20.1
    setup_cilium_marker_path: /etc/rancher/k3s/cilium-migrated

  pre_tasks:
    - name: Require the mail server become password
      ansible.builtin.assert:
        that:
          - ansible_become_password is defined
          - ansible_become_password != "CHANGE_ME"

    - name: Check whether Cilium migration is complete
      ansible.builtin.stat:
        path: "{{ setup_cilium_marker_path }}"
      become: true
      register: cni_migrate_marker

    - name: Stop when migration has already completed
      ansible.builtin.meta: end_play
      when: cni_migrate_marker.stat.exists

    - name: Save an etcd snapshot before CNI migration
      ansible.builtin.command:
        argv: [/usr/local/bin/k3s, etcd-snapshot, save, --name, pre-cilium-migration]
      become: true
      changed_when: true

    - name: Create the CNI migration backup directory
      ansible.builtin.file:
        path: /var/lib/rancher/k3s/server/cni-migration
        state: directory
        owner: root
        group: root
        mode: "0700"
      become: true

    - name: Back up the pre-Cilium K3s configuration
      ansible.builtin.copy:
        src: /etc/rancher/k3s/config.yaml
        dest: /var/lib/rancher/k3s/server/cni-migration/config.yaml.pre-cilium
        remote_src: true
        owner: root
        group: root
        mode: "0600"
        force: false
      become: true

  tasks:
    - name: Install Cilium before disabling Flannel
      ansible.builtin.include_role:
        name: setup_cilium
        apply:
          become: true

    - name: Cordon the single K3s node
      ansible.builtin.command:
        argv: [kubectl, --context, mail-server, cordon, mail-server]
      delegate_to: localhost
      changed_when: "'cordoned' in cni_migrate_cordon.stdout"
      register: cni_migrate_cordon

    - name: Apply the Cilium K3s configuration
      ansible.builtin.include_role:
        name: setup_k3s_server
        apply:
          become: true

    - name: List Pods created by the old CNI
      ansible.builtin.command:
        argv: [kubectl, --context, mail-server, get, pods, --all-namespaces, --output, json]
      delegate_to: localhost
      register: cni_migrate_pods
      changed_when: false

    - name: Recreate non-host-network Pods under Cilium
      ansible.builtin.command:
        argv:
          - kubectl
          - --context
          - mail-server
          - delete
          - pod
          - --namespace
          - "{{ item.metadata.namespace }}"
          - "{{ item.metadata.name }}"
          - --wait=false
      delegate_to: localhost
      loop: >-
        {{
          (cni_migrate_pods.stdout | from_json)['items']
          | rejectattr('spec.hostNetwork', 'defined')
          | list
        }}
      loop_control:
        label: "{{ item.metadata.namespace }}/{{ item.metadata.name }}"
      changed_when: true

    - name: Remove legacy Flannel interfaces after Pod evacuation
      ansible.builtin.command:
        argv: [/usr/sbin/ip, link, delete, "{{ item }}"]
      become: true
      loop:
        - flannel.1
        - cni0
      register: cni_migrate_legacy_link_removal
      changed_when: cni_migrate_legacy_link_removal.rc == 0
      failed_when:
        - cni_migrate_legacy_link_removal.rc != 0
        - "'Cannot find device' not in cni_migrate_legacy_link_removal.stderr"

    - name: Remove legacy Flannel CNI configuration
      ansible.builtin.file:
        path: /var/lib/rancher/k3s/agent/etc/cni/net.d/10-flannel.conflist
        state: absent
      become: true

    - name: Restart Cilium after legacy datapath cleanup
      ansible.builtin.command:
        argv:
          - kubectl
          - --context
          - mail-server
          - rollout
          - restart
          - --namespace
          - kube-system
          - daemonset/cilium
      delegate_to: localhost
      changed_when: true

    - name: Uncordon the K3s node
      ansible.builtin.command:
        argv: [kubectl, --context, mail-server, uncordon, mail-server]
      delegate_to: localhost
      register: cni_migrate_uncordon
      changed_when: "'uncordoned' in cni_migrate_uncordon.stdout"

    - name: Verify Cilium after Pod recreation
      ansible.builtin.include_role:
        name: setup_cilium
        tasks_from: verify
        apply:
          become: true

    - name: Record successful Cilium migration
      ansible.builtin.copy:
        content: "Cilium {{ setup_cilium_version }} migration completed\n"
        dest: "{{ setup_cilium_marker_path }}"
        owner: root
        group: root
        mode: "0600"
      become: true
