apiVersion: apps/v1
kind: Deployment
metadata:
  name: bulwark-deployment
  namespace: bulwark-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bulwark
  template:
    metadata:
      labels:
        app: bulwark
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bulwark
          image: ghcr.io/bulwarkmail/webmail:1.9.2
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: HOSTNAME
              value: 0.0.0.0
            - name: PORT
              value: "3000"
            - name: JMAP_SERVER_URL
              value: https://mail.winetree94.com
            - name: STALWART_FEATURES
              value: "true"
            - name: OAUTH_ENABLED
              value: "true"
            - name: OAUTH_ONLY
              value: "true"
            - name: OAUTH_CLIENT_ID
              value: bulwark-webmail
            - name: OAUTH_ISSUER_URL
              value: https://mail.winetree94.com
            - name: OAUTH_SCOPES
              value: "openid offline_access urn:ietf:params:oauth:scope:mail urn:ietf:params:oauth:scope:contacts urn:ietf:params:oauth:scope:calendars"
            - name: SESSION_SECRET_FILE
              value: /run/secrets/session-secret
            - name: SETTINGS_SYNC_ENABLED
              value: "true"
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bulwark-secrets
                  key: ADMIN_PASSWORD
            - name: ADMIN_CONFIG_DIR
              value: /app/data/admin
            - name: ADMIN_STATE_DIR
              value: /app/data/admin-state
            - name: SETTINGS_DATA_DIR
              value: /app/data/settings
            - name: TELEMETRY_DATA_DIR
              value: /app/data/telemetry
            - name: BULWARK_TELEMETRY
              value: "off"
            - name: COOKIE_SECURE
              value: "true"
            - name: TRUSTED_PROXY_DEPTH
              value: "1"
            - name: SEARCH_ENGINE_INDEXING
              value: "false"
            - name: LOG_FORMAT
              value: json
            - name: LOG_LEVEL
              value: info
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: session-secret
              mountPath: /run/secrets
              readOnly: true
            - name: temporary
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/.next/cache
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bulwark-data
        - name: session-secret
          secret:
            secretName: bulwark-secrets
            defaultMode: 0440
            items:
              - key: SESSION_SECRET
                path: session-secret
        - name: temporary
          emptyDir: {}
        - name: next-cache
          emptyDir: {}
