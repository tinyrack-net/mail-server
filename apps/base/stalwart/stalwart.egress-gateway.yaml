apiVersion: cilium.io/v2
kind: CiliumEgressGatewayPolicy
metadata:
  name: stalwart-floating-ip
spec:
  selectors:
    - podSelector:
        matchLabels:
          io.kubernetes.pod.namespace: stalwart-system
          networking.tinyrack.net/floating-egress: "true"
  destinationCIDRs:
    - 0.0.0.0/0
  egressGateway:
    nodeSelector:
      matchLabels:
        kubernetes.io/hostname: mail-server
    egressIP: 46.225.250.229
