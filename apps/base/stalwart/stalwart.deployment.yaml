apiVersion: apps/v1
kind: Deployment
metadata:
  name: stalwart-deployment
  namespace: stalwart-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stalwart
  template:
    metadata:
      labels:
        app: stalwart
        networking.tinyrack.net/floating-egress: "true"
    spec:
      initContainers:
        - name: verify-floating-egress
          image: curlimages/curl:8.21.0
          command:
            - sh
            - -ec
            - |
              while true; do
                observed_ip="$(
                  curl \
                    --fail \
                    --silent \
                    --show-error \
                    --connect-timeout 3 \
                    --max-time 5 \
                    https://www.cloudflare.com/cdn-cgi/trace \
                    | sed -n 's/^ip=//p' \
                    || true
                )"

                if [ "${observed_ip}" = "${EXPECTED_EGRESS_IP}" ]; then
                  echo "Cilium Floating IP egress is ready: ${observed_ip}"
                  exit 0
                fi

                echo \
                  "Waiting for Cilium Floating IP egress policy" \
                  "(expected=${EXPECTED_EGRESS_IP}," \
                  "observed=${observed_ip:-unavailable})"
                sleep 3
              done
          env:
            - name: EXPECTED_EGRESS_IP
              value: 46.225.250.229
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 101
            capabilities:
              drop:
                - ALL
      containers:
        - name: stalwart
          image: stalwartlabs/stalwart:v0.16.20
          imagePullPolicy: IfNotPresent
          args:
            - --config=/etc/stalwart/config.json
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "3Gi"
              cpu: "4"
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          ports:
            - containerPort: 80
            - containerPort: 443
            - containerPort: 25
            - containerPort: 587
            - containerPort: 465
            - containerPort: 143
            - containerPort: 993
            - containerPort: 4190
            - containerPort: 110
            - containerPort: 995
          volumeMounts:
            - name: stalwart-config
              mountPath: "/etc/stalwart/config.json"
              subPath: "config.json"
              readOnly: true
          env:
            - name: STALWART_PUBLIC_URL
              value: https://mail.winetree94.com
            - name: STALWART_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stalwart-database-user-secret
                  key: password
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: tinyrack-s3-secret
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: tinyrack-s3-secret
                  key: AWS_SECRET_ACCESS_KEY
            - name: STALWART_CLOUDFLARE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: stalwart-cloudflare-dns
                  key: api-token
      volumes:
        - name: stalwart-config
          configMap:
            name: stalwart-config
