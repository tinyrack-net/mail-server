apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: stalwart-backup-cleanup
  namespace: stalwart-system
rules:
  - apiGroups:
      - postgresql.cnpg.io
    resources:
      - backups
    verbs:
      - get
      - list
      - watch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: stalwart-backup-cleanup
  namespace: stalwart-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: stalwart-backup-cleanup
subjects:
  - kind: ServiceAccount
    name: kyverno-cleanup-controller
    namespace: kyverno
---
apiVersion: policies.kyverno.io/v1
kind: NamespacedDeletingPolicy
metadata:
  name: stalwart-completed-backup-cleanup
  namespace: stalwart-system
spec:
  schedule: "15 5 * * *"
  matchConstraints:
    objectSelector:
      matchLabels:
        cnpg.io/scheduled-backup: stalwart-backup
    resourceRules:
      - apiGroups:
          - postgresql.cnpg.io
        apiVersions:
          - v1
        operations:
          - "*"
        resources:
          - backups
        scope: Namespaced
  conditions:
    - name: completed
      expression: >-
        has(object.status) && has(object.status.phase) &&
        object.status.phase == "completed"
    - name: older-than-35-days
      expression: >-
        time.now() - timestamp(object.metadata.creationTimestamp)
        > duration("840h")
---
apiVersion: policies.kyverno.io/v1
kind: NamespacedDeletingPolicy
metadata:
  name: stalwart-failed-backup-cleanup
  namespace: stalwart-system
spec:
  schedule: "15 5 * * *"
  matchConstraints:
    objectSelector:
      matchLabels:
        cnpg.io/scheduled-backup: stalwart-backup
    resourceRules:
      - apiGroups:
          - postgresql.cnpg.io
        apiVersions:
          - v1
        operations:
          - "*"
        resources:
          - backups
        scope: Namespaced
  conditions:
    - name: failed
      expression: >-
        has(object.status) && has(object.status.phase) &&
        object.status.phase == "failed"
    - name: older-than-7-days
      expression: >-
        time.now() - timestamp(object.metadata.creationTimestamp)
        > duration("168h")
