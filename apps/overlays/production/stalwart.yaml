apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: stalwart
  namespace: flux-system
spec:
  dependsOn:
    - name: cloudnative-pg
    - name: kyverno
  interval: 15m
  path: ./apps/base/stalwart
  prune: true
  timeout: 5m
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
